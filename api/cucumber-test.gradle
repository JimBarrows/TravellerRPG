plugins {
    id 'java'
}

repositories {
    mavenCentral()
}

dependencies {
    // Basic dependencies for Cucumber tests
    testImplementation 'io.cucumber:cucumber-java:7.27.1'
    testImplementation 'io.cucumber:cucumber-junit-platform-engine:7.27.1'
    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.0'
    testImplementation 'org.junit.platform:junit-platform-suite:1.10.0'
    testImplementation 'org.springframework.boot:spring-boot-starter-test:3.5.4'
    testImplementation 'org.springframework.boot:spring-boot-starter-data-jpa:3.5.4'
    testImplementation 'org.springframework.boot:spring-boot-testcontainers:3.5.4'
    testImplementation 'org.testcontainers:junit-jupiter:1.19.0'
    testImplementation 'org.testcontainers:postgresql:1.19.0'
    testImplementation 'org.postgresql:postgresql:42.6.0'
}

// Simple Cucumber test task
task cucumberTest(type: JavaExec) {
    mainClass = 'io.cucumber.core.cli.Main'
    classpath = sourceSets.test.runtimeClasspath
    args = [
        '--plugin', 'pretty',
        '--plugin', 'html:build/reports/cucumber',
        '--glue', 'com.barrows.travller.api.cucumber',
        '../features'
    ]
}