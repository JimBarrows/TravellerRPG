plugins {
	id 'java'
	id 'org.springframework.boot' version '3.5.4'
	id 'io.spring.dependency-management' version '1.1.7'
	id 'jacoco'
}

group = 'com.barrows.travller'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
}

configurations {
	compileOnly {
		extendsFrom annotationProcessor
	}
}

repositories {
	mavenCentral()
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-actuator'
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-graphql'
	implementation 'org.springframework.boot:spring-boot-starter-web'
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	implementation 'org.flywaydb:flyway-core'
	implementation 'org.flywaydb:flyway-database-postgresql'
	implementation 'org.springframework.kafka:spring-kafka'
	implementation 'com.graphql-java:graphql-java-extended-scalars:24.0'
	implementation 'com.graphql-java:graphql-java-extended-validation:24.0'
	implementation 'com.graphql-java-kickstart:graphiql-spring-boot-starter:11.1.0'
	compileOnly 'org.projectlombok:lombok'
	developmentOnly 'org.springframework.boot:spring-boot-docker-compose'
	runtimeOnly 'org.postgresql:postgresql'
	annotationProcessor 'org.springframework.boot:spring-boot-configuration-processor'
	annotationProcessor 'org.projectlombok:lombok'
	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testImplementation 'org.springframework.boot:spring-boot-testcontainers'
	testImplementation 'org.springframework.graphql:spring-graphql-test'
	testImplementation 'org.springframework.kafka:spring-kafka-test'
	testImplementation 'org.testcontainers:junit-jupiter'
	testImplementation 'org.testcontainers:kafka'
	testImplementation 'org.testcontainers:postgresql'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

	// Cucumber dependencies
	testImplementation 'io.cucumber:cucumber-java:7.29.0'
	testImplementation 'io.cucumber:cucumber-spring:7.29.0'
	testImplementation 'io.cucumber:cucumber-junit-platform-engine:7.29.0'
	testImplementation 'org.junit.platform:junit-platform-suite-api:1.13.4'
}

// Create a custom task for running Cucumber tests
task runCucumberTests(type: JavaExec) {
	description = 'Runs Cucumber BDD tests.'
	group = 'verification'

	mainClass = 'io.cucumber.core.cli.Main'

	// Explicitly use Java 21
	executable = '/Users/JimBarrows/Library/Java/JavaVirtualMachines/openjdk-21.0.2/Contents/Home/bin/java'

	// Print Java version before running tests
	doFirst {
		println "Java version: ${System.getProperty('java.version')}"
		println "Java home: ${System.getProperty('java.home')}"
	}

	classpath = sourceSets.test.runtimeClasspath

	args = [
		'--plugin', 'pretty',
		'--plugin', 'html:build/reports/cucumber/cucumber.html',
		'--glue', 'com.barrows.travller.api.cucumber',
		'../features'
	]
}

// Create a custom verification task that doesn't depend on the test task
task verifyWithCucumber {
	description = 'Runs Cucumber tests as part of verification.'
	group = 'verification'

	dependsOn runCucumberTests
}

// Add our custom verification task to the build process
// Temporarily disabled until Cucumber runtime configuration is complete
// tasks.named('build') {
//     dependsOn verifyWithCucumber
// }

// JaCoCo Configuration
jacoco {
    toolVersion = "0.8.12"
}

// Configure test task to generate JaCoCo data
test {
    useJUnitPlatform {
        excludeEngines 'cucumber'
    }
    finalizedBy jacocoTestReport
}

// Create a separate task for unit tests only (excluding Cucumber)
task unitTest(type: Test) {
    group = 'verification'
    description = 'Run unit tests only (excluding Cucumber/BDD tests)'
    
    useJUnitPlatform {
        excludeEngines 'cucumber'
        includeEngines 'junit-jupiter'
    }
    
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    
    exclude '**/cucumber/**'
    
    finalizedBy jacocoTestReport
}

jacocoTestReport {
    dependsOn unitTest
    reports {
        xml.required = true
        html.required = true
        csv.required = false
    }
    
    executionData unitTest
}

jacocoTestCoverageVerification {
    dependsOn unitTest
    executionData unitTest
    
    violationRules {
        rule {
            // Set minimum based on current achieved coverage (29%)
            limit {
                counter = 'LINE'
                value = 'COVEREDRATIO'
                minimum = 0.25 // Set slightly below current 29% to allow for minor fluctuations
            }
        }
        rule {
            limit {
                counter = 'BRANCH'
                value = 'COVEREDRATIO'
                minimum = 0.05 // Set at 5% for branches (current is 7%)
            }
        }
    }
    
    // Exclude certain classes from coverage requirements
    afterEvaluate {
        classDirectories.setFrom(files(classDirectories.files.collect {
            fileTree(dir: it, exclude: [
                '**/TestApiApplication.class',      // Test configuration classes
                '**/TestcontainersConfiguration.class' // Test containers config
            ])
        }))
    }
}

// Create a task to run tests and generate coverage report
task testCoverage {
    group = 'verification'
    description = 'Run unit tests and generate coverage report'
    dependsOn 'unitTest'
    finalizedBy 'jacocoTestReport'
}

// Create a task to generate coverage reports without verification
task coverageReports {
    group = 'verification'
    description = 'Generate coverage reports without enforcing thresholds'
    dependsOn 'unitTest', 'jacocoTestReport'
}

// Create a task to run coverage verification
task verifyCoverage {
    group = 'verification'
    description = 'Verify coverage meets minimum thresholds'
    dependsOn 'jacocoTestCoverageVerification'
}
